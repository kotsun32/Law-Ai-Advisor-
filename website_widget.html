<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law AI Advisor Widget</title>
    <style>
        .law-ai-widget {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            border: 2px solid #1e3c72;
            border-radius: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-family: 'Inter', sans-serif;
        }
        
        .widget-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .widget-description {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .widget-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .feature {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .feature-text {
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .launch-button {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
            border: none;
            cursor: pointer;
        }
        
        .launch-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255,107,107,0.6);
            text-decoration: none;
            color: white;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .tech-stack {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            .law-ai-widget {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            .widget-title {
                font-size: 1.5rem;
            }
            
            .widget-features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="law-ai-widget">
        <div class="widget-title">
            ⚖️ Law AI Advisor
        </div>
        
        <div class="widget-description">
            Get instant AI-powered legal advice with advanced complexity routing and document-grounded responses.
        </div>
        
        <div class="widget-features">
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div class="feature-text">AI-Powered</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📚</div>
                <div class="feature-text">Legal Documents</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🎯</div>
                <div class="feature-text">Smart Routing</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💬</div>
                <div class="feature-text">Interactive Chat</div>
            </div>
        </div>
        
        <div style="margin-bottom: 1rem;">
            <span class="status-indicator"></span>
            <small>Live & Ready to Help</small>
        </div>
        
        <!-- Replace this URL with your actual Streamlit app URL -->
        <a href="https://legal.sunnykotwal.com" class="launch-button" target="_blank">
            Launch Chatbot
        </a>
        
        <div class="tech-stack">
            Powered by OpenAI GPT-4 • LangChain • Streamlit
        </div>
    </div>

    <!-- Optional: Add click tracking -->
    <script>
        document.querySelector('.launch-button').addEventListener('click', function() {
            // Track button click
            if (typeof gtag !== 'undefined') {
                gtag('event', 'click', {
                    'event_category': 'Law AI Advisor',
                    'event_label': 'Launch Chatbot'
                });
            }
        });
    </script>
</body>
</html>
